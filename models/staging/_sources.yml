version: 2

sources:
  - name: raw
    description: >
      Synthetic raw operational data for the Cabana Collection resorts, generated by
      scripts/generate_data.py. Read directly from committed CSVs via dbt-duckdb
      external locations, so the whole project builds from a clean clone with no
      load step. On a Snowflake target these same source names would point at
      landed raw tables instead.
    meta:
      external_location: "read_csv_auto('data/raw/{name}.csv', header=true)"
    tables:
      - name: resorts
      - name: agents
      - name: guests
      - name: bookings
      - name: payments
      - name: commissions
