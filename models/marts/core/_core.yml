version: 2

models:
  - name: dim_resort
    description: "Resort dimension with operating tenure."
    columns:
      - name: resort_id
        data_tests: [unique, not_null]

  - name: dim_agent
    description: "Sales agent dimension."
    columns:
      - name: agent_id
        data_tests: [unique, not_null]

  - name: dim_guest
    description: "Guest dimension."
    columns:
      - name: guest_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: "Calendar dimension, one row per day, built from dbt_utils.date_spine."
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_bookings
    description: >
      Booking-grain fact with booked and recognized revenue and their variance.
      Materialized incrementally on booking_date.
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: resort_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_resort')
              field: resort_id
      - name: booked_amount_usd
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'confirmed', 'cancelled', 'no_show']
